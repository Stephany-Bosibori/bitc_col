<!DOCTYPE html>

<head>

    <title>Contact Form</title>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            font-size: 14px;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .phone-group {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .phone-group select {
            width: 40%;
            margin-top: 0;
        }

        .phone-group input {
            width: 60%;
            margin-top: 0;
        }

        textarea {
            resize: none;
            height: 100px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .char-limit-note {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
    </style>
</head>

            </div>
            <div class="char-limit-note" id="limitNote">Total limit: 13 characters</div>

            <label>Subject Line</label>
            <input type="text" name="subject" placeholder="General Inquiry" required>

            <label>Message</label>
            <textarea name="message" placeholder="How can we help you?" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <script>
        const countrySelect = document.getElementById('countryCode');
        const phoneInput = document.getElementById('phoneNumber');
        const limitNote = document.getElementById('limitNote');
        const MAX_TOTAL_LENGTH = 13;

        function updatePhoneConstraints() {
            const codeLength = countrySelect.value.length;
            const remaining = MAX_TOTAL_LENGTH - codeLength;
            
            phoneInput.maxLength = remaining;
            limitNote.innerText = `Total limit: 13 (Code: ${codeLength} + Number: max ${remaining})`;

            if (phoneInput.value.length > remaining) {
                phoneInput.value = phoneInput.value.substring(0, remaining);
            }
        }

        countrySelect.addEventListener('change', updatePhoneConstraints);

        phoneInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        updatePhoneConstraints();
    </script>
